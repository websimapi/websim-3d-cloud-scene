<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cloud Scene</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <canvas id="cloudCanvas"></canvas>
        <div id="controls">
            <div class="control-panel">
                <h3>Cloud Controls</h3>
                <label>
                    Cloud Density: <input type="range" id="density" min="0.1" max="2" step="0.1" value="1">
                    <span id="densityValue">1.0</span>
                </label>
                <label>
                    Wind Speed: <input type="range" id="windSpeed" min="0" max="2" step="0.1" value="0.5">
                    <span id="windValue">0.5</span>
                </label>
                <label>
                    Time of Day: <input type="range" id="timeOfDay" min="0" max="1" step="0.01" value="0.7">
                    <span id="timeValue">0.7</span>
                </label>
            </div>
        </div>
        <div id="instructions">
            <p>Use WASD to move, mouse to look around</p>
            <p>Hold SHIFT to move faster</p>
        </div>
    </div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.158.0",
        "three/examples/jsm/controls/FirstPersonControls": "https://esm.sh/three@0.158.0/examples/jsm/controls/FirstPersonControls",
        "three/examples/jsm/loaders/TextureLoader": "https://esm.sh/three@0.158.0/examples/jsm/loaders/TextureLoader"
      }
    }
    </script>
    <script src="main.js" type="module"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
